<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10130f" />
  <title>Lineage — an evolution RTS</title>
  <meta name="description" content="Lead a clan through The First Winter. Ancestors discover; descendants find new uses." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2310130f'/%3E%3Cpath d='M16 5c2 5 7 7 7 13a7 7 0 0 1-14 0c0-3 2-4 3-6 1 2 2 2 2 3 1-3 1-6 2-10z' fill='%23ffb347'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app" class="noworld">
    <canvas id="game"></canvas>

    <div id="top">
      <div id="chips"></div>
      <div id="topbtns">
        <button data-act="pause" id="b-pause" aria-label="Pause">II</button>
        <button data-act="speed" id="b-speed" aria-label="Game speed">1x</button>
        <button data-act="menu" aria-label="Menu">Menu</button>
      </div>
    </div>

    <div id="objectives" class="card"></div>
    <div id="toasts"></div>

    <div id="bottom">
      <div id="info"></div>
      <div id="cmds"></div>
    </div>
    <div id="mini"><canvas id="minimap" width="168" height="112"></canvas></div>
    <div id="jobs" class="card hidden"></div>
    <div id="placebar" class="hidden"></div>

    <div id="panel" class="sheet hidden"></div>
    <div id="modal" class="hidden"></div>
    <input type="file" id="importfile" accept=".json,application/json" class="hidden" />
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
