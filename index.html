<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14110d" />
  <title>Lineage — an evolution RTS</title>
  <meta name="description" content="Lead a clan through The First Winter. Ancestors discover; descendants find new uses." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2314110d'/%3E%3Cpath d='M16 5c2 5 7 7 7 13a7 7 0 0 1-14 0c0-3 2-4 3-6 1 2 2 2 2 3 1-3 1-6 2-10z' fill='%23ffb347'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app" class="noworld">
    <canvas id="game"></canvas>
    <div id="alert"></div>

    <header id="topbar">
      <div id="chips"></div>
      <button type="button" id="clock" data-act="inspect:season" aria-label="Inspect season and generation"></button>
      <div id="topbtns">
        <button data-act="pause" id="b-pause" class="ib" aria-label="Pause"></button>
        <button data-act="speed" id="b-speed" class="ib" aria-label="Game speed">1x</button>
        <button data-act="sound" id="b-sound" class="ib" aria-label="Sound"></button>
        <button data-act="menu" id="b-menu" class="ib" aria-label="Menu"></button>
      </div>
    </header>

    <aside id="objectives"><div id="ogrip" class="dgrip"><span class="grip"></span><span id="opill"></span><button id="omin" class="mini" aria-label="Minimise objectives"></button></div><div id="obody"></div></aside>
    <div id="toasts"></div>
    <button id="alertbtn" class="hidden" data-act="gotoalert" aria-label="Jump to attack"></button>
    <nav id="dock"></nav>
    <div id="fab" class="hidden"><button id="fabbtn" aria-label="Actions menu"></button></div>
    <div id="bubble" class="hidden"><div id="bgrip"><span class="grip">Commands</span><button id="bpin" class="mini pinbtn" aria-label="Pin: lock position and keep open"></button><button id="bfold" class="mini" aria-label="More commands"></button></div><div id="bbody"></div></div>

    <footer id="hud">
      <div id="mini"><canvas id="minimap" width="216" height="144"></canvas></div>
      <section id="selpanel"></section>
      <section id="cmdcard"><div id="cmds"></div></section>
    </footer>

    <div id="jobs" class="hidden"><div id="jgrip" class="dgrip"><span class="grip"></span><button id="jpin" class="mini" aria-label="Keep jobs open"></button><button id="jclose" class="mini" data-act="closejobs" aria-label="Close jobs"></button></div><div id="jbody"></div></div>
    <div id="placebar" class="hidden"></div>
    <div id="tip" class="hidden"></div>
    <div id="panel" class="hidden"></div>
    <div id="modal" class="hidden"></div>
    <input type="file" id="importfile" accept=".json,application/json" class="hidden" />
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
